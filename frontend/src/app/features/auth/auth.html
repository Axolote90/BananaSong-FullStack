<div class="metaballs-bg">
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>
  <div class="blob blob4"></div>
  <div class="blob blob5"></div>
</div>

<div class="auth-wrapper">
  <div class="bento-item auth-card">
    <div class="auth-header">
      <h1>Banana Song <span class="badge">Ukelele</span></h1>
      <p>Aprende ukelele jugando</p>
    </div>

    <div class="input-group">
      <div class="input-wrapper">
        <input 
          type="text" 
          [(ngModel)]="username" 
          placeholder="Nombre de usuario" 
          [disabled]="isLoading()">
      </div>
        
      <div class="input-wrapper">
        <input 
          type="password" 
          [(ngModel)]="password" 
          placeholder="Contraseña" 
          [disabled]="isLoading()">
      </div>
    </div>

    <div class="action-group">
      <button class="btn-primary" (click)="login()" [disabled]="isLoading()">
        @if (isLoading()) { <div class="mini-spinner"></div> }
        @else { Iniciar Sesión }
      </button>
      
      <button class="btn-secondary" (click)="register()" [disabled]="isLoading()">
        Crear Cuenta
      </button>
    </div>

    @if (message()) {
      <div class="status-message" [class.error]="isError()">
        <span class="status-icon">
          @if (isError()) { ! } @else { ✓ }
        </span>
        {{ message() }}
      </div>
    }
  </div>
</div>
