<div class="auth-container">
  <div class="card">
    <h1>🍌 Banana Song</h1>
    <p>Aprende ukelele jugando</p>

    <input 
      type="text" 
      [(ngModel)]="username" 
      placeholder="Nombre de usuario" 
      [disabled]="isLoading()">
      
    <input 
      type="password" 
      [(ngModel)]="password" 
      placeholder="Contraseña" 
      [disabled]="isLoading()">

    <button class="btn-login" (click)="login()" [disabled]="isLoading()">
      Iniciar Sesión
    </button>
    
    <button class="btn-register" (click)="register()" [disabled]="isLoading()">
      Crear Cuenta
    </button>

    @if (message()) {
      <div class="status-message" [class.error]="isError()">
        {{ message() }}
      </div>
    }
  </div>
</div>
