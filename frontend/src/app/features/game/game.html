<div class="game-container" [class]="'dificultad-' + currentDifficulty()">
  
  <div class="background-pattern">
    <svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none">
      <defs>
        <linearGradient id="gradientDificultad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="90%" class="gradient-stop-1" />
          <stop offset="100%" class="gradient-stop-2" />
        </linearGradient>
      </defs>
      
      <path d="M0,0 L100,0 L100,100 L0,100 Z" fill="#aeff00"/> <path d="M0,20 C30,10 70,30 100,20 V80 C70,90 30,70 0,80 Z" fill="url(#gradientDificultad)" opacity="0.3"/>
      <path d="M0,40 C30,30 70,50 100,40 V60 C70,70 30,50 0,60 Z" fill="url(#gradientDificultad)" opacity="0.5"/>
    </svg>
  </div>

  <canvas #gameCanvas></canvas>

  <button class="pause-button" (click)="togglePause(); $event.stopPropagation()">
    <fa-icon [icon]="faPause"></fa-icon>
  </button>

  <div class="game-ui-panel">
    <div class="score-board">
      Puntuación: <span>{{ score() }}</span>
    </div>
  </div>

  <!-- Afinador removido de aquí, ahora es un componente independiente -->


  @if (gamePaused() && !isGameOver()) {
    <div class="overlay">
      <h2>Pausa</h2>
      <button class="btn-primary" (click)="togglePause()">Reanudar</button>
      <button class="btn-primary" (click)="router.navigate(['/tuner'])">Afinar Ukelele</button>
      <button class="btn-primary" (click)="restartGame()">Reiniciar Canción</button>
      <button class="btn-danger" (click)="exitGame()">Salir al Menú</button>
    </div>
  }

  @if (isGameOver()) {
    <div class="overlay results-screen">
      <h1>¡Canción Terminada! 🎸</h1>
      
      <div class="stats-card">
        <h2>Puntaje Final: <span class="text-gold">{{ score() }}</span></h2>
        <h2>Precisión: <span class="text-blue">{{ accuracy() }}%</span></h2>
        
        <div class="details-grid">
          <div class="stat-item">
            <span class="dot perfect"></span> Perfecto: {{ stats().perfect }}
          </div>
          <div class="stat-item">
            <span class="dot good"></span> Bien: {{ stats().good }}
          </div>
          <div class="stat-item">
            <span class="dot late"></span> Tarde: {{ stats().late }}
          </div>
          <div class="stat-item">
            <span class="dot miss"></span> Fallo: {{ stats().miss }}
          </div>
        </div>
      </div>

      <div class="mt-3 flex-buttons">
        <button class="btn-primary" (click)="restartGame()">Rejugar Canción</button>
        <button class="btn-danger" (click)="exitGame()">Volver al Menú</button>
      </div>
    </div>
  }
</div>
